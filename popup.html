<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PDV Mogo → iFood</title>
  <style>
    :root { color-scheme: light; font: 13px "Segoe UI", Arial, sans-serif; color: #202124; background: #f7f8fa; }
    body { width: 360px; margin: 0; padding: 16px; box-sizing: border-box; }
    h1 { margin: 0 0 4px; font-size: 17px; }
    p { margin: 0 0 13px; color: #5f6368; line-height: 1.4; }
    label { display: block; margin: 10px 0 5px; font-weight: 600; }
    select, button { box-sizing: border-box; width: 100%; min-height: 36px; border-radius: 7px; font: inherit; }
    select { border: 1px solid #dadce0; background: white; padding: 6px 8px; }
    button { margin-top: 8px; padding: 8px 10px; border: 0; background: #e94b35; color: white; font-weight: 600; cursor: pointer; }
    button.secondary { background: #303640; }
    button.light { color: #303640; background: #e8eaed; }
    button:disabled { opacity: .55; cursor: default; }
    .status { display: none; margin-top: 10px; padding: 9px; border-radius: 7px; background: #e8eaed; line-height: 1.4; }
    .status.ok { display: block; color: #155b35; background: #e6f4ea; }
    .status.err { display: block; color: #9c2923; background: #fce8e6; }
    .count { margin-top: 12px; font-size: 12px; color: #5f6368; }
    .small { margin-top: 9px; font-size: 11px; }
    .divider { border: 0; border-top: 1px solid #dadce0; margin: 15px 0; }
  </style>
</head>
<body>
  <h1>PDV Mogo → iFood</h1>
  <p>Ative a captura manualmente quando estiver em uma tela da Mogo. A extensão não usa IP ou domínio para decidir.</p>
  <label for="kind">O que esta tela mostra?</label>
  <select id="kind">
    <option value="product">Produtos</option>
    <option value="addon">Adicionais e bordas</option>
    <option value="size">Tamanhos de pizza</option>
    <option value="flavor">Sabores de pizza</option>
  </select>
  <button id="capture">Estou na Mogo — ler esta tela</button>
  <div id="status" class="status"></div>
  <div id="count" class="count">Nenhum código capturado ainda.</div>
  <button id="export" class="secondary">Exportar captura para conferência</button>
  <button id="ifood" class="secondary">Abrir revisão do iFood / Multipedidos</button>
  <button id="clear" class="light">Limpar captura</button>
  <hr class="divider">
  <p class="small">A captura reúne as telas que você abrir. Confira os nomes e IDs antes de usar; nada é salvo no iFood nesta etapa.</p>
  <script src="popup.js"></script>
</body>
</html>
